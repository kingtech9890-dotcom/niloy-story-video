
name: Render Niloy Story

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP
        run: unzip -q niloy-story-remotion.zip -d extracted

      - name: Install dependencies
        working-directory: extracted/niloy-video
        run: npm install

      - name: Setup browser
        working-directory: extracted/niloy-video
        run: npx remotion browser ensure

      - name: Render video
        working-directory: extracted/niloy-video
        run: npm run render

      - name: Save MP4
        uses: actions/upload-artifact@v4
        with:
          name: Niloy-Story-MP4
          path: extracted/niloy-video/out/niloy-story.mp4
          if-no-files-found: error
          retention-days: 7
